# 큐레이션된 정부조직 SNS 핸들 시드.
#
# 이 파일은 자동 시드의 출발점입니다. 모든 항목은 verified=false 와 동등하게
# 취급되며, 사용자가 검토 후 data/gov_orgs.yaml 로 직접 옮기거나
# `python scripts/apply_known_handles.py --apply` 로 일괄 반영할 수 있습니다.
#
# 표기 규칙:
#   youtube   : "@handle" (또는 channel/UCxxxx)
#   instagram : "username" (앞 @ 제거)
#   x         : "username"
#   facebook  : "pagename"
#   blog      : 전체 URL
#
# confidence 필드:
#   high   - 공식 홈페이지 푸터에서 자주 확인되는 핸들
#   medium - 일반적으로 알려진 핸들이지만 변경 가능성 있음
#   low    - 추정값. 반드시 사용자가 확인 필요
#
# 빈 항목은 자동 시드 대상이 아니므로, scripts/discover_handles.py 로 보완하세요.

