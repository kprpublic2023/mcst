# 정부조직 SNS 시드 파일 (2026년 정부조직법 기준 19부 6처 19청 6위원회)
#
# 사용법:
#   - 각 기관의 accounts 항목에 공식 SNS 핸들/URL을 채워주세요.
#   - 채워지지 않은 항목은 수집기가 "운영하지 않음(또는 미확인)"으로 처리합니다.
#   - verified: false 인 항목은 자동 시드로 추정만 한 것이므로 반드시 검토 후 true 로 바꿔주세요.
#   - 실 수집 시 platform 별 핸들 형식:
#       youtube   : "@channelhandle"  또는  "channel/UCxxxx"
#       instagram : "username"        (앞에 @ 없이)
#       x         : "username"        (앞에 @ 없이)
#       facebook  : "pagename"        또는 페이지 ID
#       blog      : full URL (네이버/티스토리 등)
#
# verified 필드:
#   true  = 사람이 공식 홈페이지·계정에서 확인 완료
#   false = 자동 추정/공란. UI에서 노란 배지로 표시됨.

